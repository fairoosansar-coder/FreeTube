name: Build AegisTube AegisOS Artifact

on:
  workflow_dispatch:

# This fork builds a self-contained web payload for the AegisOS shell. It has
# no write permission and cannot upload anything to FreeTubeApp/FreeTube.
permissions:
  contents: read

jobs:
  build-embed:
    name: Validate and package AegisTube for AegisOS
    if: github.repository != 'FreeTubeApp/FreeTube'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact fork revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
          cache: false

      - name: Install dependencies and validate source
        run: |
          pnpm run ci
          pnpm run lint-all

      - name: Build private-path AegisOS payload
        env:
          AEGISOS_PUBLIC_PATH: ./
        run: |
          pnpm run pack:web
          mkdir -p dist/web/source
          git archive --format=tar.gz \
            --prefix="aegistube-web-${GITHUB_SHA}/" \
            -o "dist/web/source/aegistube-web-${GITHUB_SHA}.tar.gz" \
            "${GITHUB_SHA}"
          cp LICENSE AEGISOS-MODIFICATIONS.md SOURCE.md THIRD_PARTY_NOTICES.md dist/web/
          pnpm licenses list --json > dist/web/THIRD_PARTY_LICENSES.json
          node _scripts/writeAegisBuildInfo.mjs

      - name: Verify embedded paths and source identity
        run: |
          web_bundle="$(find dist/web -maxdepth 1 -type f -name 'web.*.js' -print -quit)"
          test -n "${web_bundle}"
          test -s "${web_bundle}"
          grep -Eq 'src="\./web\.[^"]+\.js"' dist/web/index.html
          grep -Fq 'n.p="./"' "${web_bundle}"
          node -e "const i=require('./dist/web/build-info.json'); if(i.revision!==process.env.GITHUB_SHA || i.source!=='https://github.com/fairoosansar-coder/FreeTube/tree/'+process.env.GITHUB_SHA) process.exit(1)"
          test -s "dist/web/source/aegistube-web-${GITHUB_SHA}.tar.gz"

      - name: Upload AegisOS payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegistube-aegisos-${{ github.sha }}
          path: dist/web/
          if-no-files-found: error
          retention-days: 90
