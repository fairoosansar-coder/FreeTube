name: Deploy AegisOS FreeTube Web

on:
  push:
    branches: [aegisos-web-v0.25.1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aegisos-freetube-web-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build isolated web edition
        env:
          AEGISOS_PUBLIC_PATH: /FreeTube/
        run: pnpm run pack:web

      - name: Publish license, notices, and exact corresponding source
        shell: bash
        run: |
          mkdir -p dist/web/source
          git archive --format=tar.gz --prefix="aegisos-freetube-web-${GITHUB_SHA}/" -o "dist/web/source/aegisos-freetube-web-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"
          cp LICENSE AEGISOS-MODIFICATIONS.md SOURCE.md THIRD_PARTY_NOTICES.md dist/web/
          pnpm licenses list --json > dist/web/THIRD_PARTY_LICENSES.json
          node _scripts/writeAegisBuildInfo.mjs
          touch dist/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
